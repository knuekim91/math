<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>데프니의 수능 수학 탐구</title>
<style>
  :root {
    --main: #1f4e8c; --main-light: #e8f0fb; --accent: #f08c2e;
    --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --bg: #f5f7fb;
    --low: #d1fae5; --mid: #fef3c7; --high: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); }

  header { background: var(--main); color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 40px; height: 40px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; }
  header h1 { font-size: 20px; margin: 0; }
  header p { margin: 0; font-size: 13px; opacity: 0.85; }

  .layout { display: flex; min-height: calc(100vh - 70px); }

  /* 왼쪽 메뉴: 세로 탭(MENU) 하나, 누르면 컴팩트 메뉴 펼침 */
  #side { display: flex; width: 40px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line); position: sticky; top: 0; height: calc(100vh - 70px); transition: width 0.2s ease; }
  #side.open { width: 300px; }
  #sidePanel { width: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; transition: width 0.2s ease; }
  #side.open #sidePanel { width: 260px; }
  .side-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .row-label { font-size: 12px; font-weight: bold; color: var(--muted); width: 100%; }
  .side-btn { background: #fff; border: 1px solid #cbd5e1; border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: bold; color: var(--main); cursor: pointer; white-space: nowrap; }
  .side-btn:hover { background: var(--main-light); }
  .side-btn.active { background: var(--main-light); border-left: 3px solid var(--accent); }
  #examPanel { display: none; padding: 16px 14px; font-size: 13px; color: var(--muted); }
  #side.view-exam #examPanel { display: block; }
  #side.view-exam #nav { display: none !important; }
  #navTab { writing-mode: vertical-rl; width: 40px; flex-shrink: 0; background: var(--main); color: #fff; border: none; cursor: pointer; font-size: 13px; font-weight: bold; letter-spacing: 4px; padding: 16px 0; }
  #navTab:hover { background: #173b6b; }
  #nav { display: none; flex: 1; overflow-y: auto; padding: 6px 0 16px; font-size: 13px; }
  #side.open.view-concept #nav { display: block; }
  #nav .acc-btn { padding: 7px 12px; font-size: 13px; }
  #nav .acc-btn.subject { font-size: 14px; }
  #nav .acc-btn.unit { padding-left: 22px; font-size: 12px; }
  #nav .sub-title { padding: 6px 12px 2px 32px; font-size: 11px; }
  #nav .concept-btn { padding: 5px 10px 5px 40px; font-size: 13px; }
  #nav .soon { padding: 6px 12px 8px 24px; }

  .acc-item > .acc-body { display: none; }
  .acc-item.open > .acc-body { display: block; }
  .acc-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; padding: 11px 20px; font-size: 14px; font-weight: bold; color: var(--main); cursor: pointer; text-align: left; }
  .acc-btn:hover, .acc-item.open > .acc-btn { background: var(--main-light); }
  .acc-btn.subject { font-size: 15px; border-bottom: 1px solid var(--line); }
  .acc-btn.unit { font-size: 13px; padding-left: 28px; color: var(--text); }
  .arrow { color: var(--muted); font-size: 12px; }
  .soon { color: var(--muted); font-weight: normal; font-size: 12px; padding: 8px 20px 12px 32px; }

  .sub-title { display: block; width: 100%; background: none; border: none; text-align: left; font-size: 12px; color: var(--muted); padding: 8px 20px 2px 40px; cursor: pointer; }
  .sub-title:hover { color: var(--main); }
  .sum-tag { font-size: 11px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .summary-card ul { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 15px; }
  .concept-btn { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 20px 8px 48px; font-size: 14px; color: var(--text); cursor: pointer; border-left: 3px solid transparent; }
  .concept-btn:hover { background: var(--main-light); }
  .concept-btn.active { background: var(--main-light); border-left-color: var(--accent); font-weight: bold; color: var(--main); }

  main { flex: 1; padding: 24px 32px; max-width: 900px; }
  .heading { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-title { font-weight: bold; font-size: 16px; }

  .badge { display: inline-block; font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 999px; }
  .badge.하 { background: var(--low); color: #065f46; }
  .badge.중 { background: var(--mid); color: #92400e; }
  .badge.상 { background: var(--high); color: #991b1b; }
  .badge.none { background: #e5e7eb; color: #374151; }

  .question { font-size: 16px; line-height: 1.7; margin: 8px 0 14px; }
  .answer-row { display: flex; gap: 8px; }
  input.answer { flex: 1; max-width: 240px; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  button.primary { background: var(--main); color: #fff; border: none; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .choices { display: grid; gap: 6px; margin: 6px 0 10px; }
  .choice { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; cursor: pointer; }
  .choice:hover { background: var(--main-light); }
  button.primary:hover { background: #173b6b; }

  .wrong-btn { position: absolute; top: 10px; right: 10px; border-radius: 6px; border: 1.5px solid #e53e3e; background: #fff5f5; color: #c53030; cursor: pointer; padding: 1px 6px; font-size: 12px; font-weight: bold; line-height: 1.3; }
  .wrong-btn:hover { background: #fed7d7; }

  .result { margin-top: 12px; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6; }
  .result.ok { background: #ecfdf5; color: #065f46; }
  .result.ng { background: #fef2f2; color: #991b1b; }

  .rec-title { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .rec { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: #fafbff; font-size: 14px; }
  .rec .kind { font-size: 12px; color: var(--main); font-weight: bold; min-width: 60px; }

  .muted { color: var(--muted); font-size: 14px; }
  .empty { background: #fff; border: 1px dashed #cbd5e1; border-radius: 14px; padding: 30px; text-align: center; color: var(--muted); }
  #error { color: #b91c1c; margin-bottom: 12px; }
  .auth { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  .auth input { padding: 5px 8px; border-radius: 6px; border: none; font-size: 12px; width: 180px; }
  .auth-btn { background: #fff; color: var(--main); border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .auth-user, .auth-msg { color: #fff; opacity: 0.9; }

  /* 문항 기능: 별점 · 버튼 · 정답/풀이 블록 */
  [hidden] { display: none !important; }
  .badge.lv { background: var(--main-light); color: var(--main); }
  .actions { display: flex; gap: 8px; margin: 12px 0 4px; }
  button.ghost { background: #fff; color: var(--main); border: 1px solid var(--main); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.ghost:hover { background: var(--main-light); }
  .block { margin-top: 10px; padding: 14px 16px; background: #fafbff; border: 1px solid var(--line); border-radius: 10px; }
  .block-title { font-size: 13px; font-weight: bold; color: var(--main); margin: 4px 0 6px; }
  .block-title + .solution + .block-title { margin-top: 14px; }
  .solution { font-size: 15px; line-height: 1.75; }
  .alt { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .alt-title { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .alt-text { font-size: 14px; line-height: 1.6; margin-bottom: 6px; }
  .alt-img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .alt-add { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .alt-add input[type=text] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
  label.upload { background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .rating { display: flex; align-items: center; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
  .rate-label { font-size: 13px; color: var(--muted); margin-right: 6px; }
  .star { background: none; border: none; font-size: 20px; color: #d1d5db; cursor: pointer; padding: 0 2px; }
  .star:hover { color: var(--accent); }
  .rate-avg { font-size: 13px; color: var(--muted); margin-left: 8px; }

  /* 전국연합 문항 이미지 */
  .exam-month { font-size: 17px; margin: 22px 0 10px; color: var(--main); }
  .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  figure.problem { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  figure.problem img { display: block; width: 100%; height: auto; }
  figure.problem figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: right; }
  .exam-card .card-head { flex-wrap: wrap; }
  .exam-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
  .exam-chip { background: #fff; color: var(--main); border: 1px solid var(--main); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .exam-chip:hover { background: var(--main-light); }
  .exam-chip.on { background: var(--main); color: #fff; }
  .my-ans { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .pick-row { display: flex; gap: 6px; }
  .pick { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px 10px; font-size: 15px; cursor: pointer; }
  .pick.on { background: var(--main); color: #fff; border-color: var(--main); }
  .short-in { width: 120px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
  .ans-res { font-size: 14px; }
  .ok-t { color: #059669; }
  .ng-t { color: #dc2626; }
  .exam-img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    #side { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--line); flex-direction: column; }
    #side.open { width: 100%; }
    #side.open #sidePanel { width: 100%; }
    #navTab { writing-mode: horizontal-tb; width: 100%; height: 36px; padding: 0 16px; letter-spacing: 1px; text-align: left; }
    #sidePanel { height: auto; }
    #nav { max-height: 260px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <text x="20" y="31" font-size="32" font-family="Times New Roman, serif" fill="#fff" text-anchor="middle">Σ</text>
    </svg>
  </div>
  <div>
    <h1>데프니의 수능 수학 탐구</h1>
    <p>마지막이라 생각말고 끝까지 최선을</p>
  </div>
  <div id="authBox" class="auth"></div>
</header>

<div class="layout">
  <aside id="side">
    <button id="navTab" aria-expanded="false">MENU</button>
    <div id="sidePanel">
      <div class="side-row">
        <span class="row-label">개념</span>
        <button class="side-btn subj-btn" data-subject="공통수학1">공수1</button>
        <button class="side-btn subj-btn" data-subject="공통수학2">공수2</button>
        <button class="side-btn subj-btn" data-subject="대수">대수</button>
        <button class="side-btn subj-btn" data-subject="미적분">미적분</button>
        <button class="side-btn subj-btn" data-subject="확률과통계">확통</button>
      </div>
      <div class="side-row">
        <span class="row-label">전국연합</span>
        <button class="side-btn grade-btn" data-grade="고1">고1</button>
        <button class="side-btn grade-btn" data-grade="고2">고2</button>
        <button class="side-btn grade-btn" data-grade="고3">고3</button>
      </div>
      <div id="nav"></div>
      <div id="examPanel">전국연합 기출 문항은 준비 중입니다.</div>
    </div>
  </aside>
  <main>
    <div id="error"></div>
    <h2 class="heading" id="heading">개념을 선택하세요</h2>
    <div class="sub" id="sub"></div>
    <div id="items"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://utqvqickqqosvzgfxisv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UDQb4kjAiGz_YjvpKIViSw_u1cpXSG_';
  const SUBJECTS = ['공통수학1', '공통수학2', '대수', '미적분', '확률과통계'];
  const SUBJ_HTML = {};

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function loadConcepts() {
    const { data, error } = await db.from('concepts')
      .select('id, subject, unit, sub_unit, name, kind')
      .eq('kind', '교과')
      .order('id');
    if (error) {
      $('nav').innerHTML = '<div class="soon">개념 데이터를 불러오지 못했습니다.</div>';
      return;
    }

    const tree = {};
    data.forEach(c => {
      tree[c.subject] ||= {};
      tree[c.subject][c.unit] ||= {};
      (tree[c.subject][c.unit][c.sub_unit] ||= []).push(c);
    });

    SUBJECTS.forEach((subject, si) => {
      const units = tree[subject];
      let html = `<div class="acc-item">
        <button class="acc-btn subject" onclick="toggleAcc(this)">${esc(subject)}<span class="arrow">▸</span></button>
        <div class="acc-body">`;
      if (!units) {
        html += '<div class="soon">준비 중입니다</div>';
      } else {
        Object.keys(units).forEach(unit => {
          html += `<div class="acc-item">
            <button class="acc-btn unit" onclick="toggleAcc(this)">${esc(unit)}<span class="arrow">▸</span></button>
            <div class="acc-body">`;
          Object.keys(units[unit]).forEach(sub => {
            html += `<button class="sub-title sub-btn" data-sub="${esc(sub)}">${esc(sub)} <span class="sum-tag">요약</span></button>`;
            units[unit][sub].forEach(c => {
              html += `<button class="concept-btn" data-id="${c.id}" data-name="${esc(c.name)}" data-sub="${esc(subject)} · ${esc(sub)}">${esc(c.name)}</button>`;
            });
          });
          html += '</div></div>';
        });
      }
      html += '</div></div>';
      SUBJ_HTML[subject] = html;
    });
    showSubject(SUBJECTS[0]);
  }

  // 선택한 과목의 단원 목록만 보여줍니다.
  function showSubject(subject) {
    $('nav').innerHTML = SUBJ_HTML[subject] || '<div class="soon">준비 중입니다</div>';

    $('nav').querySelectorAll('.concept-btn').forEach(btn => {
      btn.onclick = () => selectConcept(btn);
    });

    const firstSubject = $('nav').querySelector('.acc-item');
    firstSubject.classList.add('open');
    const firstUnit = firstSubject.querySelector('.acc-item');
    if (firstUnit) firstUnit.classList.add('open');
    $('nav').querySelectorAll('.sub-btn').forEach(btn => {
      btn.onclick = () => showSummary(btn.dataset.sub);
    });
    const first = $('nav').querySelector('.concept-btn');
    if (first) selectConcept(first);
  }

  async function showSummary(sub) {
    $('nav').querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
    $('heading').textContent = sub;
    $('sub').textContent = '소단원 요약 정리';
    $('items').innerHTML = '<div class="muted">불러오는 중…</div>';
    const { data, error } = await db.from('subunit_summaries')
      .select('summary')
      .eq('sub_unit', sub)
      .maybeSingle();
    if (error) return showError(error.message);
    if (!data) { $('items').innerHTML = '<div class="empty">이 소단원의 요약은 아직 준비 중입니다.</div>'; return; }
    const lines = data.summary.split('\n').filter(Boolean);
    $('items').innerHTML = `<div class="card summary-card"><ul>${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
  }

  // 같은 단계의 다른 항목은 접고, 누른 항목만 펼칩니다.
  window.toggleAcc = (btn) => {
    const item = btn.parentElement;
    const willOpen = !item.classList.contains('open');
    item.parentElement.querySelectorAll(':scope > .acc-item').forEach(i => i.classList.remove('open'));
    if (willOpen) item.classList.add('open');
  };

  function selectConcept(btn) {
    $('nav').querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $('heading').textContent = btn.dataset.name;
    $('sub').textContent = btn.dataset.sub;
    loadItems(Number(btn.dataset.id));
  }

  let currentConcept = null;
  async function loadItems(conceptId) {
    currentConcept = conceptId;
    $('items').innerHTML = '<div class="muted">불러오는 중…</div>';
    const { data, error } = await db.from('items')
      .select('id, difficulty, difficulty_level, question_text, answer, solution_steps, choices, alt_solutions')
      .eq('concept_id', conceptId)
      .order('difficulty');
    if (error) return showError(error.message);
    const visible = data.filter(it => !/^2026-/.test(it.id));
    $('items').innerHTML = visible.length
      ? visible.map(itemCard).join('')
      : '<div class="empty">이 개념에 연결된 문항이 아직 없습니다.</div>';
    visible.forEach(it => { ITEMS[it.id] = it; loadRating(it.id); });
  }

  // 별점 라벨 (별 1~5)
  const LEVELS = { 1: '암산', 2: '쉬움', 3: '보통', 4: '어렵', 5: '킬러' };
  const ITEMS = {};
  const RATER_KEY = 'mathworld_rater_id';
  const raterId = localStorage.getItem(RATER_KEY) || (localStorage.setItem(RATER_KEY, crypto.randomUUID()), localStorage.getItem(RATER_KEY));

  function badge(d) {
    return `<span class="badge ${d || 'none'}">${d ? d : '난이도 미정'}</span>`;
  }

  function levelBadge(lv) {
    return lv
      ? `<span class="badge lv">★${lv} ${LEVELS[lv]}</span>`
      : '<span class="badge none">난이도 미정</span>';
  }

  function starRow(id) {
    const shown = '아직 평가 없음';
    const stars = [1, 2, 3, 4, 5].map(n =>
      `<button class="star" onclick="rate('${id}', ${n})" aria-label="${n}점">★</button>`).join('');
    return `<div class="rating"><span class="rate-label">내가 느끼는 난이도</span>${stars}<span class="rate-avg" id="avg-${id}">${shown}</span></div>`;
  }

  async function loadRating(id) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/item_rating_summary?select=avg_stars,rating_count&item_id=eq.${id}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    }).then(r => r.json()).catch(() => []);
    const el = $('avg-' + id);
    if (el && r[0]) el.textContent = `평균 ${r[0].avg_stars} (${r[0].rating_count}명)`;
  }

  // 로그인 (이메일 링크 방식)
  async function currentToken() {
    const { data } = await db.auth.getSession();
    return data.session?.access_token || null;
  }
  async function currentUser() {
    const { data } = await db.auth.getSession();
    return data.session?.user || null;
  }
  function renderAuth(user) {
    $('authBox').innerHTML = user
      ? `<span class="auth-user">${esc(user.email)}</span><button class="auth-btn" onclick="logout()">로그아웃</button>`
      : `<input id="authEmail" type="email" placeholder="이메일 주소" /><button class="auth-btn" onclick="sendLink()">로그인 링크 받기</button><span id="authMsg" class="auth-msg"></span>`;
  }
  window.sendLink = async () => {
    const email = $('authEmail').value.trim();
    if (!email) return;
    const btn = document.querySelector('#authBox .auth-btn');
    if (btn) btn.disabled = true;
    const { error } = await db.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
    if (btn) setTimeout(() => { btn.disabled = false; }, 3000);
    // 메시지는 한 줄만 보이도록 매번 덮어씁니다.
    let text = '메일에서 로그인 링크를 눌러 주세요.';
    if (error) {
      text = /rate limit/i.test(error.message)
        ? '메일 발송 횟수 제한에 걸렸습니다. 잠시 후 다시 시도해 주세요.'
        : `로그인 메일 발송 실패: ${error.message}`;
    }
    $('authMsg').textContent = text;
  };
  window.logout = async () => { await db.auth.signOut(); renderAuth(null); };
  db.auth.onAuthStateChange((_event, session) => renderAuth(session?.user || null));

  window.rate = async (id, stars) => {
    const user = await currentUser();
    if (!user) return showError('별점은 로그인 후 저장할 수 있습니다.');
    const token = await currentToken();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/item_ratings?on_conflict=item_id,rater_id`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify({ item_id: id, rater_id: user.id, stars })
    });
    if (!res.ok) return showError('별점 저장 실패');
    $('avg-' + id).textContent = '별점이 저장되었습니다';
    loadRating(id);
  };

  window.toggleBlock = (id, kind) => {
    const box = $(`${kind}-${id}`);
    box.hidden = !box.hidden;
  };

  function solutionBlock(it) {
    const steps = (it.solution_steps || []).map(esc).join('<br>');
    const alts = (it.alt_solutions || []).map(a => `
      <div class="alt">
        <div class="alt-title">${esc(a.title || '다른 풀이')}</div>
        ${a.text ? `<div class="alt-text">${esc(a.text)}</div>` : ''}
        ${a.image_url ? `<img class="alt-img" src="${esc(a.image_url)}" alt="다른 풀이 캡쳐" />` : ''}
      </div>`).join('');
    return `
      <div class="block" id="sol-${it.id}" hidden>
        <div class="block-title">풀이</div>
        <div class="solution">${steps || '<span class="muted">풀이가 아직 없습니다.</span>'}</div>
        <div class="block-title">다른 풀이</div>
        ${alts || '<div class="muted">등록된 다른 풀이가 없습니다.</div>'}
        <div class="alt-add">
          <input type="text" id="alt-text-${it.id}" placeholder="다른 풀이 설명 (선택)" />
          <label class="upload">캡쳐 파일 선택
            <input type="file" accept="image/*" hidden onchange="addAlt('${it.id}', this)" />
          </label>
        </div>
      </div>`;
  }

  window.addAlt = async (id, input) => {
    const file = input.files[0];
    if (!file) return;
    const token = await currentToken();
    if (!token) return showError('다른 풀이는 로그인 후 추가할 수 있습니다.');
    const text = $('alt-text-' + id).value.trim();
    const path = `${id}/${Date.now()}_${file.name.replace(/[^\w.\-]/g, '_')}`;
    const up = await fetch(`${SUPABASE_URL}/storage/v1/object/solution-images/${path}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, 'Content-Type': file.type },
      body: file
    });
    if (!up.ok) return showError('이미지 업로드 실패');
    const image_url = `${SUPABASE_URL}/storage/v1/object/public/solution-images/${path}`;
    const alts = [...(ITEMS[id].alt_solutions || []), { title: `다른 풀이 ${(ITEMS[id].alt_solutions || []).length + 1}`, text, image_url, created_at: new Date().toISOString() }];
    const patch = await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${id}`, {
      method: 'PATCH',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ alt_solutions: alts })
    });
    if (!patch.ok) return showError('다른 풀이 저장 실패');
    ITEMS[id].alt_solutions = alts;
    if ($('side').classList.contains('view-exam')) showExam('고1');
    else loadItems(currentConcept);
  };

  function itemCard(it) {
    const parts = it.id.split('-');
    let title;
    if (it.id.startsWith('PR-')) title = '연습 문제';
    else if (it.id.startsWith('SIM-')) title = `${parts[1]}년 ${+parts[2]}월 ${+parts[3]}번 유사${parts[4] || 1}`;
    else title = `${parts[0]}년 ${+parts[1]}월 · ${+parts[2]}번`;
    const answerBox = it.choices
      ? `<div class="choices">${it.choices.map((c, i) => `
           <label class="choice"><input type="radio" name="ans-${it.id}" value="${esc(c)}" /> ${i + 1}. ${esc(c)}</label>`).join('')}
         </div>`
      : `<input class="answer" id="ans-${it.id}" placeholder="답을 입력하세요" />`;
    const body = it.question_text
      ? `<div class="question">${esc(it.question_text)}</div>
         ${answerBox}
         <div class="answer-row">
           <button class="primary" onclick="check('${it.id}')">확인</button>
         </div>
         <div id="res-${it.id}"></div>`
      : '<div class="muted" style="margin-top:8px">기출 문제는 본문을 공개하지 않습니다. 아래 추천 문항을 확인하세요.</div>';
    const hasAnswer = it.answer !== null && it.answer !== undefined && it.answer !== '';
    const answerBlock = `
      <div class="block" id="ansb-${it.id}" hidden>
        <div class="block-title">정답</div>
        <div class="solution">${hasAnswer ? esc(it.answer) : '<span class="muted">정답이 아직 입력되지 않았습니다.</span>'}</div>
      </div>`;
    const actions = `
      <div class="actions">
        <button class="ghost" onclick="toggleBlock('${it.id}', 'ansb')">정답 보기</button>
        <button class="ghost" onclick="toggleBlock('${it.id}', 'sol')">풀이 · 다른 풀이</button>
      </div>`;
    return `
      <div class="card">
        <button class="wrong-btn" onclick="wrong('${it.id}')">틀림</button>
        <div class="card-head">${levelBadge(it.difficulty_level)}<span class="card-title">${esc(title)}</span></div>
        ${body}
        ${actions}
        ${answerBlock}
        ${solutionBlock(it)}
        ${starRow(it.id)}
        <div id="rec-${it.id}"></div>
      </div>`;
  }

  window.check = (itemId) => {
    const picked = document.querySelector(`input[name="ans-${itemId}"]:checked`);
    const typed = document.getElementById('ans-' + itemId);
    const input = picked ? picked.value : (typed ? typed.value.trim() : '');
    if (!input) return;
    const res = document.getElementById('res-' + itemId);
    fetch(`${SUPABASE_URL}/rest/v1/items?select=answer,solution_steps&id=eq.${itemId}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    }).then(r => r.json()).then(([row]) => {
      const ok = input === String(row.answer).trim();
      const steps = (row.solution_steps || []).map(esc).join('<br>');
      res.innerHTML = ok
        ? '<div class="result ok"><strong>정답입니다!</strong></div>'
        : `<div class="result ng"><strong>아쉬워요.</strong> 풀이: ${steps}</div>`;
    });
  };

  window.wrong = async (itemId) => {
    const { data, error } = await db.from('item_relations')
      .select('relation_type, to_item_id, items!item_relations_to_item_id_fkey(difficulty)')
      .eq('from_item_id', itemId)
      .in('relation_type', ['연계', '유사']);
    if (error) return showError(error.message);
    const box = $('rec-' + itemId);
    if (!data.length) { box.innerHTML = '<div class="muted" style="margin-top:10px">추천 문항이 없습니다.</div>'; return; }
    box.innerHTML = '<div class="rec-title">이렇게 연습해 보세요</div>' + data.map(r => `
      <div class="rec">
        <span class="kind">${r.relation_type === '연계' ? '쉬운 문항' : '비슷한 유형'}</span>
        <span>${esc(r.to_item_id)}</span>
        ${badge(r.items?.difficulty)}
      </div>`).join('');
  };

  function showError(msg) { $('error').textContent = '오류: ' + msg; }

  // MENU 탭: 누르면 오른쪽으로 펼쳐지고, 다시 누르면 왼쪽으로 접힙니다.
  $('navTab').onclick = () => {
    const side = $('side');
    const open = side.classList.toggle('open');
    $('navTab').setAttribute('aria-expanded', String(open));
  };

  // 개념 / 전국연합 선택
  // 개념 과목 또는 전국연합 학년 중 하나만 선택됩니다.
  function setSelected(btn) {
    document.querySelectorAll('.subj-btn, .grade-btn').forEach(b => b.classList.toggle('active', b === btn));
  }

  document.querySelectorAll('.subj-btn').forEach(btn => {
    btn.onclick = () => {
      setSelected(btn);
      const side = $('side');
      side.classList.remove('view-exam');
      side.classList.add('view-concept');
      $('items').innerHTML = '';
      showSubject(btn.dataset.subject);
    };
  });
  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.onclick = () => {
      setSelected(btn);
      const side = $('side');
      side.classList.remove('view-concept');
      side.classList.add('view-exam');
      showExam(btn.dataset.grade);
    };
  });
  $('side').classList.add('view-concept');

  // 전국연합 문항: DB(items)에서 EXAM-1G 문항을 읽어 카드로 보여줍니다.
  async function showExam(grade) {
    $('heading').textContent = `전국연합 ${grade}`;
    if (grade !== '고1') {
      $('sub').textContent = '';
      $('items').innerHTML = '<div class="empty">준비 중입니다.</div>';
      return;
    }
    $('items').innerHTML = '<div class="muted">불러오는 중…</div>';
    const { data, error } = await db.from('items')
      .select('id, source, number, points, image_url, answer, difficulty_level, solution_steps, alt_solutions')
      .like('id', 'EXAM-1G-%')
      .order('id');
    if (error) return showError(error.message);
    data.forEach(it => { ITEMS[it.id] = it; });
    const sources = [...new Set(data.map(it => it.source))];
    $('sub').textContent = '시험을 골라 문항을 확인하세요.';
    // 시험 선택 버튼: 하나를 누르면 그 시험의 문항만 보입니다.
    const chips = [{ key: '', label: '전체' }, ...sources.map(s => ({ key: s, label: s }))];
    const render = (key) => {
      document.querySelectorAll('.exam-chip').forEach(b => b.classList.toggle('on', b.dataset.key === key));
      const shown = key ? sources.filter(s => s === key) : sources;
      $('examBody').innerHTML = shown.map(src => `
        <h3 class="exam-month">${esc(src)}</h3>
        <div class="exam-grid">${data.filter(it => it.source === src).map(examCard).join('')}</div>`).join('');
      data.forEach(it => loadRating(it.id));
      loadMyAnswers();
    };
    $('items').innerHTML = `<div class="exam-chips">${chips.map(c =>
      `<button class="exam-chip" data-key="${esc(c.key)}">${esc(c.label)}</button>`).join('')}</div><div id="examBody"></div>`;
    document.querySelectorAll('.exam-chip').forEach(b => b.onclick = () => render(b.dataset.key));
    render('');
  }

  function examCard(it) {
    const pts = it.points ? `${it.points}점` : '';
    const answerBlock = `
      <div class="block" id="ansb-${it.id}" hidden>
        <div class="block-title">정답</div>
        <div class="solution">${it.answer ? esc(it.answer) : '<span class="muted">정답이 아직 입력되지 않았습니다.</span>'}</div>
      </div>`;
    return `
      <div class="card exam-card">
        <div class="card-head">
          <span class="card-title">${it.number}번</span>
          <span class="muted">${esc(pts)}</span>
          ${levelBadge(it.difficulty_level)}
        </div>
        <img class="exam-img" loading="lazy" src="${esc(it.image_url)}" alt="${it.number}번 문항" />
        <div class="actions">
          <button class="ghost" onclick="toggleBlock('${it.id}', 'ansb')">정답 보기</button>
          <button class="ghost" onclick="toggleBlock('${it.id}', 'sol')">풀이 · 다른 풀이</button>
        </div>
        ${answerBlock}
        ${solutionBlock(it)}
        ${answerForm(it)}
        ${starRow(it.id)}
      </div>`;
  }

  // 학생 답 제출: 1~21번은 ①~⑤ 선택, 22~30번은 직접 입력
  const PENDING = {};
  function answerForm(it) {
    const inner = it.number <= 21
      ? `<div class="pick-row">${[1, 2, 3, 4, 5].map(v =>
          `<button class="pick" data-id="${it.id}" data-v="${v}" onclick="pickAns(this)">${'①②③④⑤'[v - 1]}</button>`).join('')}</div>`
      : `<input class="short-in" id="ansin-${it.id}" placeholder="답 입력" />`;
    return `
      <div class="my-ans">
        <span class="rate-label">내 답</span>${inner}
        <button class="ghost" onclick="submitAns('${it.id}')">제출</button>
        <span class="ans-res" id="res-${it.id}"></span>
      </div>`;
  }

  window.pickAns = (btn) => {
    const id = btn.dataset.id;
    PENDING[id] = btn.dataset.v;
    btn.parentElement.querySelectorAll('.pick').forEach(b => b.classList.toggle('on', b === btn));
  };

  // 제출 이력(회차별)을 "1회 틀림 · 2회 틀림 · 3회 맞음" 형식으로 표시합니다.
  const HISTORY = {};
  function showHistory(id) {
    const el = $('res-' + id);
    if (!el) return;
    const rows = HISTORY[id] || [];
    if (!rows.length) { el.innerHTML = ''; return; }
    const registered = ITEMS[id] && ITEMS[id].answer !== null && ITEMS[id].answer !== '';
    const last = rows[rows.length - 1];
    const trail = rows.map(r => {
      if (!registered) return `${r.attempt_no}회 제출`;
      return `${r.attempt_no}회 ${r.is_correct ? '<strong class="ok-t">맞음</strong>' : '<strong class="ng-t">틀림</strong>'}`;
    }).join(' · ');
    el.innerHTML = `최근 답 ${esc(last.answer)}<br><span class="muted">${trail}</span>${registered ? '' : ' <span class="muted">(정답 미등록)</span>'}`;
  }

  window.submitAns = async (id) => {
    const input = $('ansin-' + id);
    const val = String(PENDING[id] ?? (input ? input.value : '')).trim();
    if (!val) return;
    const user = await currentUser();
    if (!user) return showError('답 제출은 로그인 후 가능합니다.');
    const token = await currentToken();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/student_attempts`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify({ user_id: user.id, item_id: id, answer: val })
    });
    if (!res.ok) return showError('답 저장 실패');
    const [row] = await res.json();
    (HISTORY[id] ||= []).push(row);
    showHistory(id);
    if (input) input.value = '';
    delete PENDING[id];
    document.querySelectorAll(`.pick[data-id="${id}"]`).forEach(b => b.classList.remove('on'));
  };

  // 로그인한 계정의 이전 답안 기록을 불러와 표시합니다.
  async function loadMyAnswers() {
    const user = await currentUser();
    if (!user) return;
    const token = await currentToken();
    const rows = await fetch(`${SUPABASE_URL}/rest/v1/student_attempts?select=item_id,attempt_no,answer,is_correct&user_id=eq.${user.id}&order=attempt_no.asc`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` }
    }).then(r => r.json()).catch(() => []);
    if (!Array.isArray(rows)) return;
    rows.forEach(r => (HISTORY[r.item_id] ||= []).push(r));
    Object.keys(HISTORY).forEach(id => showHistory(id));
  }

  loadConcepts();
</script>
</body>
</html>
