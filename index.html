<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MathWorld 문항 추천</title>
<style>
  :root {
    --main: #1f4e8c; --main-light: #e8f0fb; --accent: #f08c2e;
    --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --bg: #f5f7fb;
    --low: #d1fae5; --mid: #fef3c7; --high: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); }

  header { background: var(--main); color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; }
  header h1 { font-size: 20px; margin: 0; }
  header p { margin: 0; font-size: 13px; opacity: 0.85; }

  .layout { display: flex; min-height: calc(100vh - 70px); }

  nav { width: 280px; background: #fff; border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 0 16px; max-height: calc(100vh - 70px); position: sticky; top: 0; }

  .acc-item > .acc-body { display: none; }
  .acc-item.open > .acc-body { display: block; }
  .acc-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; padding: 11px 20px; font-size: 14px; font-weight: bold; color: var(--main); cursor: pointer; text-align: left; }
  .acc-btn:hover, .acc-item.open > .acc-btn { background: var(--main-light); }
  .acc-btn.subject { font-size: 15px; border-bottom: 1px solid var(--line); }
  .acc-btn.unit { font-size: 13px; padding-left: 28px; color: var(--text); }
  .arrow { color: var(--muted); font-size: 12px; }
  .soon { color: var(--muted); font-weight: normal; font-size: 12px; padding: 8px 20px 12px 32px; }

  .sub-title { display: block; width: 100%; background: none; border: none; text-align: left; font-size: 12px; color: var(--muted); padding: 8px 20px 2px 40px; cursor: pointer; }
  .sub-title:hover { color: var(--main); }
  .sum-tag { font-size: 11px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .summary-card ul { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 15px; }
  .concept-btn { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 20px 8px 48px; font-size: 14px; color: var(--text); cursor: pointer; border-left: 3px solid transparent; }
  .concept-btn:hover { background: var(--main-light); }
  .concept-btn.active { background: var(--main-light); border-left-color: var(--accent); font-weight: bold; color: var(--main); }

  main { flex: 1; padding: 24px 32px; max-width: 900px; }
  .heading { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-title { font-weight: bold; font-size: 16px; }

  .badge { display: inline-block; font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 999px; }
  .badge.하 { background: var(--low); color: #065f46; }
  .badge.중 { background: var(--mid); color: #92400e; }
  .badge.상 { background: var(--high); color: #991b1b; }
  .badge.none { background: #e5e7eb; color: #374151; }

  .question { font-size: 16px; line-height: 1.7; margin: 8px 0 14px; }
  .answer-row { display: flex; gap: 8px; }
  input.answer { flex: 1; max-width: 240px; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  button.primary { background: var(--main); color: #fff; border: none; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .choices { display: grid; gap: 6px; margin: 6px 0 10px; }
  .choice { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; cursor: pointer; }
  .choice:hover { background: var(--main-light); }
  button.primary:hover { background: #173b6b; }

  .wrong-btn { position: absolute; top: 10px; right: 10px; border-radius: 6px; border: 1.5px solid #e53e3e; background: #fff5f5; color: #c53030; cursor: pointer; padding: 1px 6px; font-size: 12px; font-weight: bold; line-height: 1.3; }
  .wrong-btn:hover { background: #fed7d7; }

  .result { margin-top: 12px; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6; }
  .result.ok { background: #ecfdf5; color: #065f46; }
  .result.ng { background: #fef2f2; color: #991b1b; }

  .rec-title { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .rec { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: #fafbff; font-size: 14px; }
  .rec .kind { font-size: 12px; color: var(--main); font-weight: bold; min-width: 60px; }

  .muted { color: var(--muted); font-size: 14px; }
  .empty { background: #fff; border: 1px dashed #cbd5e1; border-radius: 14px; padding: 30px; text-align: center; color: var(--muted); }
  #error { color: #b91c1c; margin-bottom: 12px; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    nav { width: 100%; max-height: 260px; position: static; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <div>
    <h1>MathWorld</h1>
    <p>고등학교 수학 개념별 문항 추천</p>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div id="error"></div>
    <h2 class="heading" id="heading">개념을 선택하세요</h2>
    <div class="sub" id="sub"></div>
    <div id="items"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://syalqcgnualsznjfgbhl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_1UNLM-L5teNNXk0zBq0S_g_kVFSAvhm';
  const SUBJECTS = ['공통수학1', '공통수학2', '대수', '미적분', '확률과통계'];

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function loadConcepts() {
    const { data, error } = await db.from('concepts')
      .select('id, subject, unit, sub_unit, name, kind')
      .eq('kind', '교과')
      .order('id');
    if (error) return showError(error.message);

    const tree = {};
    data.forEach(c => {
      tree[c.subject] ||= {};
      tree[c.subject][c.unit] ||= {};
      (tree[c.subject][c.unit][c.sub_unit] ||= []).push(c);
    });

    let html = '';
    SUBJECTS.forEach((subject, si) => {
      const units = tree[subject];
      html += `<div class="acc-item">
        <button class="acc-btn subject" onclick="toggleAcc(this)">${esc(subject)}<span class="arrow">▸</span></button>
        <div class="acc-body">`;
      if (!units) {
        html += '<div class="soon">준비 중입니다</div>';
      } else {
        Object.keys(units).forEach(unit => {
          html += `<div class="acc-item">
            <button class="acc-btn unit" onclick="toggleAcc(this)">${esc(unit)}<span class="arrow">▸</span></button>
            <div class="acc-body">`;
          Object.keys(units[unit]).forEach(sub => {
            html += `<button class="sub-title sub-btn" data-sub="${esc(sub)}">${esc(sub)} <span class="sum-tag">요약</span></button>`;
            units[unit][sub].forEach(c => {
              html += `<button class="concept-btn" data-id="${c.id}" data-name="${esc(c.name)}" data-sub="${esc(subject)} · ${esc(sub)}">${esc(c.name)}</button>`;
            });
          });
          html += '</div></div>';
        });
      }
      html += '</div></div>';
    });
    $('nav').innerHTML = html;

    $('nav').querySelectorAll('.concept-btn').forEach(btn => {
      btn.onclick = () => selectConcept(btn);
    });

    const firstSubject = $('nav').querySelector('.acc-item');
    firstSubject.classList.add('open');
    const firstUnit = firstSubject.querySelector('.acc-item');
    if (firstUnit) firstUnit.classList.add('open');
    $('nav').querySelectorAll('.sub-btn').forEach(btn => {
      btn.onclick = () => showSummary(btn.dataset.sub);
    });
    const first = $('nav').querySelector('.concept-btn');
    if (first) selectConcept(first);
  }

  async function showSummary(sub) {
    $('nav').querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
    $('heading').textContent = sub;
    $('sub').textContent = '소단원 요약 정리';
    $('items').innerHTML = '<div class="muted">불러오는 중…</div>';
    const { data, error } = await db.from('subunit_summaries')
      .select('summary')
      .eq('sub_unit', sub)
      .maybeSingle();
    if (error) return showError(error.message);
    if (!data) { $('items').innerHTML = '<div class="empty">이 소단원의 요약은 아직 준비 중입니다.</div>'; return; }
    const lines = data.summary.split('\n').filter(Boolean);
    $('items').innerHTML = `<div class="card summary-card"><ul>${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
  }

  // 같은 단계의 다른 항목은 접고, 누른 항목만 펼칩니다.
  window.toggleAcc = (btn) => {
    const item = btn.parentElement;
    const willOpen = !item.classList.contains('open');
    item.parentElement.querySelectorAll(':scope > .acc-item').forEach(i => i.classList.remove('open'));
    if (willOpen) item.classList.add('open');
  };

  function selectConcept(btn) {
    $('nav').querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $('heading').textContent = btn.dataset.name;
    $('sub').textContent = btn.dataset.sub;
    loadItems(Number(btn.dataset.id));
  }

  async function loadItems(conceptId) {
    $('items').innerHTML = '<div class="muted">불러오는 중…</div>';
    const { data, error } = await db.from('items')
      .select('id, difficulty, question_text, answer, solution_steps, choices')
      .eq('concept_id', conceptId)
      .order('difficulty');
    if (error) return showError(error.message);
    const visible = data.filter(it => !/^2026-/.test(it.id));
    $('items').innerHTML = visible.length
      ? visible.map(itemCard).join('')
      : '<div class="empty">이 개념에 연결된 문항이 아직 없습니다.</div>';
  }

  function badge(d) {
    return `<span class="badge ${d || 'none'}">${d ? d : '난이도 미정'}</span>`;
  }

  function itemCard(it) {
    const parts = it.id.split('-');
    let title;
    if (it.id.startsWith('PR-')) title = '연습 문제';
    else if (it.id.startsWith('SIM-')) title = `${parts[1]}년 ${+parts[2]}월 ${+parts[3]}번 유사${parts[4] || 1}`;
    else title = `${parts[0]}년 ${+parts[1]}월 · ${+parts[2]}번`;
    const answerBox = it.choices
      ? `<div class="choices">${it.choices.map((c, i) => `
           <label class="choice"><input type="radio" name="ans-${it.id}" value="${esc(c)}" /> ${i + 1}. ${esc(c)}</label>`).join('')}
         </div>`
      : `<input class="answer" id="ans-${it.id}" placeholder="답을 입력하세요" />`;
    const body = it.question_text
      ? `<div class="question">${esc(it.question_text)}</div>
         ${answerBox}
         <div class="answer-row">
           <button class="primary" onclick="check('${it.id}')">확인</button>
         </div>
         <div id="res-${it.id}"></div>`
      : '<div class="muted" style="margin-top:8px">기출 문제는 본문을 공개하지 않습니다. 아래 추천 문항을 확인하세요.</div>';
    return `
      <div class="card">
        <button class="wrong-btn" onclick="wrong('${it.id}')">틀림</button>
        <div class="card-head">${badge(it.difficulty)}<span class="card-title">${esc(title)}</span></div>
        ${body}
        <div id="rec-${it.id}"></div>
      </div>`;
  }

  window.check = (itemId) => {
    const picked = document.querySelector(`input[name="ans-${itemId}"]:checked`);
    const typed = document.getElementById('ans-' + itemId);
    const input = picked ? picked.value : (typed ? typed.value.trim() : '');
    if (!input) return;
    const res = document.getElementById('res-' + itemId);
    fetch(`${SUPABASE_URL}/rest/v1/items?select=answer,solution_steps&id=eq.${itemId}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    }).then(r => r.json()).then(([row]) => {
      const ok = input === String(row.answer).trim();
      const steps = (row.solution_steps || []).map(esc).join('<br>');
      res.innerHTML = ok
        ? '<div class="result ok"><strong>정답입니다!</strong></div>'
        : `<div class="result ng"><strong>아쉬워요.</strong> 풀이: ${steps}</div>`;
    });
  };

  window.wrong = async (itemId) => {
    const { data, error } = await db.from('item_relations')
      .select('relation_type, to_item_id, items!item_relations_to_item_id_fkey(difficulty)')
      .eq('from_item_id', itemId)
      .in('relation_type', ['연계', '유사']);
    if (error) return showError(error.message);
    const box = $('rec-' + itemId);
    if (!data.length) { box.innerHTML = '<div class="muted" style="margin-top:10px">추천 문항이 없습니다.</div>'; return; }
    box.innerHTML = '<div class="rec-title">이렇게 연습해 보세요</div>' + data.map(r => `
      <div class="rec">
        <span class="kind">${r.relation_type === '연계' ? '쉬운 문항' : '비슷한 유형'}</span>
        <span>${esc(r.to_item_id)}</span>
        ${badge(r.items?.difficulty)}
      </div>`).join('');
  };

  function showError(msg) { $('error').textContent = '오류: ' + msg; }

  loadConcepts();
</script>
</body>
</html>
